# =============================================================================
#  Trend collection, in the cloud. No laptop involved.
# =============================================================================
#  The worker's collect loop was the only part of this system that wanted the
#  machine on 24/7. It doesn't need to be on THIS machine: `radar collect` is
#  pure Node with zero dependencies, no Chrome, no ffmpeg, no Python. It fetches
#  feeds, scores them, and writes one JSON file.
#
#  So it runs here instead, and the laptop only has to be on when YOU are using
#  the portal - the same as any other app.
#
#  BUDGET (this repo is private, so minutes are metered: 2000/month free)
#    a real run measured 651s = 10.9 min
#    every 6h  = 4/day = ~1300 min/month   <- chosen, 65% of budget
#    every 4h  = 6/day = ~1950 min/month      98%, one retry blows it
#  If you make the repo public, Actions minutes become unlimited and you can
#  drop this to hourly. Weigh that against publishing your whole content plan.
#
#  STATE lives on an orphan `factory-data` branch, force-pushed as a single
#  commit every run. That keeps trends.json durable without growing the repo by
#  1.1MB every six hours.
# =============================================================================

name: collect trends

on:
  schedule:
    - cron: "0 */6 * * *" # 00:00 06:00 12:00 18:00 UTC
  workflow_dispatch: # and a "Run workflow" button, for when you want it now

# Only one collect at a time. Two runs writing trends.json would race, and the
# loser's findings would be silently discarded by the force-push.
concurrency:
  group: collect-trends
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # ~2x the measured 10.9min; a hung feed shouldn't burn budget

    permissions:
      contents: write # to push the factory-data branch

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20" # package.json engines: >=20

      # No `npm ci`: radar has zero dependencies and the CLI entry is plain ESM.
      # Installing the whole workspace would pull Remotion - minutes for nothing.

      - name: Restore trends.json from the data branch
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin factory-data >/dev/null 2>&1; then
            git fetch --depth=1 origin factory-data
            git show FETCH_HEAD:trends.json > data/trends.json
            echo "restored $(wc -c < data/trends.json) bytes"
          else
            echo "no data branch yet - this is the first run, starting empty"
          fi

      - name: Collect
        env:
          # Passed as real env vars. config.js populates process.env without
          # overriding what's already set, so no .env file is needed.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FREE_MODEL: ${{ secrets.OPENROUTER_FREE_MODEL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          AI_TIER: free # cloud runs stay on the free tier; no surprise spend
        run: node packages/cli/bin/factory.js radar collect

      - name: Save trends.json back to the data branch
        run: |
          test -s data/trends.json || { echo "collect produced no trends.json - not pushing"; exit 1; }
          tmp=$(mktemp -d)
          cp data/trends.json "$tmp/trends.json"
          cd "$tmp"
          git init -q
          git checkout -q -b factory-data
          git add trends.json
          git -c user.name="factory-bot" -c user.email="factory-bot@users.noreply.github.com" \
              commit -q -m "trends @ $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # force-push a single-commit branch: durable state, zero repo growth
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" factory-data
          echo "pushed $(wc -c < trends.json) bytes to factory-data"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Collect run"
            if [ -s data/trends.json ]; then
              echo "- trends.json: **$(( $(wc -c < data/trends.json) / 1024 ))KB**"
              node -e "try{const t=require('./data/trends.json');const a=Array.isArray(t)?t:(t.items||t.trends||[]);console.log('- items: **'+a.length+'**')}catch(e){}" || true
            else
              echo "- no trends.json produced"
            fi
            echo "- pull it locally: \`npm run sync:trends\`"
          } >> "$GITHUB_STEP_SUMMARY"
