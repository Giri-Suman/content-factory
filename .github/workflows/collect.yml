name: collect trends

on:
  schedule:
    - cron: "0 */6 * * *" # 00:00 06:00 12:00 18:00 UTC
  workflow_dispatch:

# Scheduled collection and dispatched cloud jobs edit the same small R2
# collections, so they must not run at the same time.
concurrency:
  group: content-factory-cloud-state
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The radar and R2 sync use Node built-ins; no media tool installation is
      # needed for this scheduled job.
      - name: Collect and update the family portal
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FREE_MODEL: ${{ secrets.OPENROUTER_FREE_MODEL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          AI_TIER: free
        run: node scripts/collect-to-portal.mjs
